<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C158" />
      <stop offset="50%" stop-color="#C5A047" />
      <stop offset="100%" stop-color="#9A7B2C" />
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#123466" />
      <stop offset="100%" stop-color="#081C38" />
    </linearGradient>
  </defs>

  <!-- Outer Swoosh Ring - Back Navy Portion -->
  <path d="M 18 72 C 12 40, 48 22, 82 22 C 112 22, 122 45, 106 62" 
        fill="none" stroke="url(#navyGrad)" stroke-width="5" stroke-linecap="round"/>

  <!-- Letter 'A' Left Leg -->
  <path d="M 64 14 L 20 108 H 38 L 48 84 H 64 Z" fill="url(#navyGrad)" />

  <!-- Letter 'A' Right Leg -->
  <path d="M 64 14 L 108 108 H 90 L 80 84 H 64 Z" fill="url(#navyGrad)" />

  <!-- Inner Ascending Financial Growth Bars (Gold) -->
  <rect x="50" y="70" width="6" height="14" rx="1.5" fill="url(#goldGrad)" />
  <rect x="59" y="62" width="6" height="22" rx="1.5" fill="url(#goldGrad)" />
  <rect x="68" y="54" width="6" height="30" rx="1.5" fill="url(#goldGrad)" />

  <!-- Outer Swoosh Ring - Front Gold Orbit -->
  <path d="M 16 68 C 10 92, 45 110, 82 104 C 115 98, 125 76, 108 60 C 96 48, 62 52, 38 64" 
        fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round"/>
</svg>
